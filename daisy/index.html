<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Daisy Music Bot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #0b0f0c;
      color: white;
      text-align: center;
    }
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .btn {
      margin-top: 20px;
      padding: 14px 26px;
      background: #22c55e;
      color: black;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="hero">
    <h1>Daisy Music Bot</h1>
    <p>High-quality music for your Discord server</p>
    <a class="btn" href="#">Add to Discord</a>
  </div>

</body>
</html>
